name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm, cache-dependency-path: tools/package-lock.json }
      - run: npm ci
        working-directory: tools
      - name: syntaxe de chaque fichier
        run: for f in $(git ls-files 'src/*.js' 'src/**/*.js' 'tests/*.cjs' 'tools/*.cjs'); do node --check "$f" || exit 1; done
      - run: node build.mjs
        working-directory: tools
      - name: index.js est à jour (généré depuis src/)
        run: git diff --exit-code index.js
      - name: tests (unitaires, mutations des mails, fil de conversation, chargement du plugin)
        run: node tests/run.cjs
        env: { NODE_PATH: tools/node_modules }
      - name: aucune dépendance vulnérable connue (outils de construction)
        run: npm audit --omit=dev --audit-level=high || true
        working-directory: tools
  publier:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: la version du tag est celle du package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm pack
      - name: version GitHub avec l'archive
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" *.tgz --title "${GITHUB_REF_NAME}" --notes "Voir CHANGELOG.md"
